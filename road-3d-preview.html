<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Road 3D 预览 — GLB 接入验证</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #0f172a;
      color: white;
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    }
    #info {
      position: fixed;
      top: 12px;
      left: 12px;
      padding: 14px 16px;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid #00d9a5;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.7;
      z-index: 10;
      max-width: 320px;
    }
    #info h3 { margin: 0 0 8px 0; color: #00d9a5; font-size: 14px; }
    #info code { background: #1e293b; padding: 1px 6px; border-radius: 3px; font-size: 11px; }
    canvas { display: block; }
    #status {
      position: fixed;
      bottom: 12px;
      left: 12px;
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid #444;
      border-radius: 8px;
      font-size: 12px;
      font-family: ui-monospace, "Cascadia Mono", Menlo, monospace;
      z-index: 10;
      min-width: 380px;
    }
    #status.ok { border-color: #00d9a5; color: #00d9a5; }
    #status.fail { border-color: #ef4444; color: #ef4444; }
  </style>
</head>
<body>
  <div id="info">
    <h3>🚗 Road 3D 接入验证</h3>
    素材：<code>public/models/car-sedan-original.glb</code><br />
    引擎：three.js r185 + GLTFLoader<br />
    验收：FPS ≥ 30 / 加载 ≤ 5s / 三角面可见<br />
    操作：鼠标拖拽旋转 / 滚轮缩放
  </div>
  <div id="status">状态：初始化中…</div>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/examples/jsm/loaders/GLTFLoader.js";
    import { OrbitControls } from "three/examples/jsm/controls/OrbitControls.js";

    const statusEl = document.getElementById("status");
    const setStatus = (msg, level = "info") => {
      statusEl.textContent = "状态：" + msg;
      statusEl.classList.remove("ok", "fail");
      if (level === "ok") statusEl.classList.add("ok");
      if (level === "fail") statusEl.classList.add("fail");
      console.log("[STATUS]", msg);
    };

    // ===== 场景 / 相机 / 渲染器 =====
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f172a);
    scene.fog = new THREE.Fog(0x0f172a, 8, 60);

    const camera = new THREE.PerspectiveCamera(
      50,
      innerWidth / innerHeight,
      0.1,
      1000
    );
    camera.position.set(4, 2.5, 6);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio));
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    document.body.appendChild(renderer.domElement);

    // ===== 光照（沿用方案 C 顶层设计） =====
    const ambient = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambient);
    const sun = new THREE.DirectionalLight(0xffffff, 1.5);
    sun.position.set(5, 10, 5);
    scene.add(sun);

    // ===== 参考地面（便于判断模型尺寸/位置） =====
    const grid = new THREE.GridHelper(20, 20, 0x334455, 0x222233);
    scene.add(grid);
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(40, 40),
      new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.9 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.001;
    scene.add(ground);

    // ===== 控制器 =====
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0.5, 0);
    controls.update();

    // ===== FPS 监控 =====
    let frameCount = 0;
    let lastFpsTime = performance.now();
    let loadMs = 0;
    let loadTriangles = 0;
    let loadBytes = 0;

    const animate = () => {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
      frameCount++;
      const now = performance.now();
      if (now - lastFpsTime >= 1000) {
        const fps = ((frameCount * 1000) / (now - lastFpsTime)).toFixed(1);
        setStatus(
          `加载 ${loadMs}ms (${(loadBytes / 1024 / 1024).toFixed(2)}MB) | 三角面 ${loadTriangles.toLocaleString()} | FPS ${fps} | 相机 (${camera.position.x.toFixed(1)}, ${camera.position.y.toFixed(1)}, ${camera.position.z.toFixed(1)})`
        );
        frameCount = 0;
        lastFpsTime = now;
      }
    };
    animate();

    // ===== 加载 GLB =====
    setStatus("开始加载 GLB…");
    const t0 = performance.now();
    const loader = new GLTFLoader();
    loader.load(
      "./models/car-sedan-original.glb",
      (gltf) => {
        loadMs = Math.round(performance.now() - t0);
        loadBytes = gltf.parser?.json?.buffers?.[0]?.byteLength || 0;

        const model = gltf.scene;

        // 自动居中 + 缩放到合理尺寸
        const box = new THREE.Box3().setFromObject(model);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        model.position.sub(center);
        model.position.y += size.y / 2; // 让车轮落地
        const maxDim = Math.max(size.x, size.y, size.z);
        const scale = maxDim > 5 ? 5 / maxDim : 1;
        model.scale.setScalar(scale);

        // 统计三角面（关键性能指标）
        let triCount = 0;
        let meshCount = 0;
        model.traverse((n) => {
          if (n.isMesh) {
            meshCount++;
            const idx = n.geometry.index;
            triCount += idx ? idx.count / 3 : n.geometry.attributes.position.count / 3;
          }
        });
        loadTriangles = Math.round(triCount);

        // 单面渲染（补救 doubleSided 性能问题）
        model.traverse((n) => {
          if (n.isMesh && n.material) {
            if (Array.isArray(n.material)) {
              n.material.forEach((m) => (m.side = THREE.FrontSide));
            } else {
              n.material.side = THREE.FrontSide;
            }
          }
        });

        scene.add(model);
        window.__LOAD_OK__ = true;
        window.__LOAD_INFO__ = {
          ms: loadMs,
          bytes: loadBytes,
          triangles: loadTriangles,
          meshes: meshCount,
        };
        setStatus(
          `✅ 加载成功 ${loadMs}ms / ${(loadBytes / 1024 / 1024).toFixed(2)}MB / ${loadTriangles.toLocaleString()} 面 / ${meshCount} mesh`,
          "ok"
        );
      },
      (xhr) => {
        if (xhr.total) {
          const pct = (xhr.loaded / xhr.total) * 100;
          setStatus(
            `加载中… ${pct.toFixed(0)}% (${(xhr.loaded / 1024 / 1024).toFixed(1)}MB / ${(xhr.total / 1024 / 1024).toFixed(1)}MB)`
          );
        }
      },
      (err) => {
        console.error(err);
        window.__LOAD_OK__ = false;
        window.__LOAD_ERROR__ = err.message || String(err);
        setStatus("❌ 加载失败：" + (err.message || err), "fail");
      }
    );

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
